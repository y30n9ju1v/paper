{{ define "main" }}
<style>
  .graph-container {
    width: 100%;
    height: 85vh;
    background: var(--body-background);
    border: 1px solid rgba(128,128,128,0.3);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  #graph-svg { width: 100%; height: 100%; }
  .link {
    stroke: rgba(128,128,128,0.35);
    stroke-width: 1.2;
  }
  .node circle {
    stroke-width: 1.5;
    cursor: pointer;
  }
  .node text {
    font-size: 11px;
    pointer-events: none;
    fill: var(--body-font-color);
  }
  .tooltip {
    position: absolute;
    background: var(--body-background);
    border: 1px solid var(--body-font-color);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 260px;
    z-index: 10;
    line-height: 1.5;
  }
  .graph-controls {
    margin-bottom: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .graph-controls input {
    padding: 5px 10px;
    border: 1px solid var(--body-font-color);
    border-radius: 4px;
    background: var(--body-background);
    color: var(--body-font-color);
    font-size: 13px;
    width: 220px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    opacity: 0.8;
  }
  .legend-item:hover { opacity: 1; }
  .legend-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>

<article class="markdown book-article">
  <h1>논문 연관 관계 그래프</h1>
  <p>논문 간 인용/영향 관계를 시각화합니다. 노드를 클릭하면 해당 논문으로 이동합니다. 노드 크기는 피인용 수에 비례합니다.</p>

  <div class="graph-controls">
    <input type="text" id="graphSearch" placeholder="논문 제목 검색...">
  </div>
  <div class="legend" id="legend"></div>

  <div class="graph-container">
    <svg id="graph-svg"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>
</article>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const BASE = window.location.origin + "/paper/";
const COLOR_MAP = {
  "deep-learning":        "#4e79a7",
  "novel-view-synthesis": "#59a14f",
  "generative-models":    "#f28e2b",
  "perception":           "#e15759",
  "simulation":           "#76b7b2",
  "planning":             "#edc948",
  "dataset":              "#b07aa1",
};
const LABEL_MAP = {
  "deep-learning":        "Deep Learning",
  "novel-view-synthesis": "Novel View Synthesis",
  "generative-models":    "Generative Models",
  "perception":           "Perception",
  "simulation":           "Simulation",
  "planning":             "Planning",
  "dataset":              "Dataset",
};

// Legend
const legend = document.getElementById("legend");
Object.entries(LABEL_MAP).forEach(([k, v]) => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-dot" style="background:${COLOR_MAP[k]}"></div><span>${v}</span>`;
  legend.appendChild(item);
});

fetch(BASE + "graph-data.json")
  .then(r => r.json())
  .then(initGraph)
  .catch(err => {
    document.querySelector(".graph-container").innerHTML =
      `<p style="padding:20px;color:red">그래프 데이터 로드 실패: ${err}</p>`;
  });

function initGraph(data) {
  const svg = d3.select("#graph-svg");
  const container = document.querySelector(".graph-container");
  const W = container.clientWidth;
  const H = container.clientHeight;

  const inDegree = {};
  data.nodes.forEach(n => { inDegree[n.id] = 0; });
  data.links.forEach(l => {
    inDegree[l.target] = (inDegree[l.target] || 0) + 1;
  });

  const nodes = data.nodes.map(d => ({ ...d }));
  const links = data.links.map(d => ({ ...d }));

  const g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.1, 4]).on("zoom", e => g.attr("transform", e.transform)));

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(90))
    .force("charge", d3.forceManyBody().strength(-220))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collision", d3.forceCollide(d => radius(d) + 3));

  function radius(d) {
    return Math.sqrt((inDegree[d.id] || 0) * 3 + 10);
  }

  const linkEl = g.append("g").selectAll("line")
    .data(links).enter().append("line").attr("class", "link");

  const nodeEl = g.append("g").selectAll("g.node")
    .data(nodes).enter().append("g").attr("class", "node")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on("click", (e, d) => { window.location.href = d.url; })
    .on("mouseover", (e, d) => {
      const tt = document.getElementById("tooltip");
      tt.innerHTML = `<strong>${d.title}</strong><br><small>${LABEL_MAP[d.category] || d.category} · ${d.year || "–"}</small>`;
      tt.style.opacity = 1;
    })
    .on("mousemove", e => {
      const tt = document.getElementById("tooltip");
      const rect = container.getBoundingClientRect();
      tt.style.left = (e.clientX - rect.left + 14) + "px";
      tt.style.top  = (e.clientY - rect.top  - 10) + "px";
    })
    .on("mouseout", () => { document.getElementById("tooltip").style.opacity = 0; });

  nodeEl.append("circle")
    .attr("r", d => radius(d))
    .attr("fill", d => COLOR_MAP[d.category] || "#aaa")
    .attr("stroke", d => d3.color(COLOR_MAP[d.category] || "#aaa").darker(0.7));

  nodeEl.append("text")
    .attr("dy", "0.35em")
    .attr("x", d => radius(d) + 4)
    .text(d => d.title.length > 20 ? d.title.slice(0, 20) + "…" : d.title);

  sim.on("tick", () => {
    linkEl
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeEl.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // Search
  document.getElementById("graphSearch").addEventListener("input", function() {
    const q = this.value.toLowerCase();
    nodeEl.select("circle").attr("opacity", d =>
      !q || d.title.toLowerCase().includes(q) ? 1 : 0.15
    );
    nodeEl.select("text").attr("opacity", d =>
      !q || d.title.toLowerCase().includes(q) ? 1 : 0.1
    );
    linkEl.attr("opacity", d => {
      if (!q) return 1;
      const sm = d.source.title?.toLowerCase().includes(q);
      const tm = d.target.title?.toLowerCase().includes(q);
      return sm || tm ? 0.8 : 0.05;
    });
  });
}
</script>
{{ end }}
